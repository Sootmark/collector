# Supply-chain policy. Runs in CI on every change.

[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# Permissive only, so every Sootmark product can use this crate.
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
unused-allowed-license = "allow"
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A helper library for evidence parsing has no business talking to the network.
deny = [
    { name = "reqwest" },
    { name = "hyper" },
    { name = "ureq" },
    { name = "curl" },
    { name = "isahc" },
    { name = "surf" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
