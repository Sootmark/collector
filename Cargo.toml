[package]
name = "sootmark-collector"
version = "0.7.0"
edition = "2021"
rust-version = "1.85"
description = "A forensic triage collector for Windows: reads NTFS raw (locked files, $MFT, $UsnJrnl, hives with their logs) and streams what a signed job names into one zip with a hashed manifest, encrypted to the case. Open source, so what runs on your hosts can be read."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sootmark/collector"
homepage = "https://sootmark.com"
keywords = ["forensics", "dfir", "incident-response", "triage", "ntfs"]
categories = ["command-line-utilities"]
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[lib]
name = "collector"

[[bin]]
name = "sootmark-collector"
path = "src/main.rs"

[dependencies]
age = { package = "sootmark-age", version = "0.1.0" }
common = { package = "sootmark-common", version = "0.3.6" }
disk = { package = "sootmark-disk", version = "0.3.3" }
prefetch = { package = "sootmark-prefetch", version = "0.1.1" }
registry = { package = "sootmark-registry", version = "0.6.3" }
zip = { package = "sootmark-zip", version = "0.4.0" }
# Signatures are never written in-house (D11): ed25519-dalek (BSD-3-Clause).
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }

# Windows' own declarations for the few calls that set the collector's
# priority and limits (src/limits.rs); MIT OR Apache-2.0, no logic.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
